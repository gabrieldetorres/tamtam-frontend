name: tests

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

jobs:
  node-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the business-layer tests
        run: npm test

      - name: Check that the site builds
        env:
          API_URL: https://api.example.com/api/v1
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_check
        run: |
          node scripts/build-config.js development
          test -f dist/index.html
          test -f dist/config.js
          test ! -e dist/.env.development
